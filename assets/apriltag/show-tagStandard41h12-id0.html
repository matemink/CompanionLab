<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CompanionLab AprilTag ID 0</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Cascadia Mono", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #161a1d;
      color: #f5f3ed;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .marker {
      width: min(72vmin, 720px);
      aspect-ratio: 1;
      padding: 7%;
      background: white;
      box-shadow: 0 18px 70px rgb(0 0 0 / 45%);
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    p {
      margin: 0;
      color: #aeb8c1;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main>
    <div class="marker">
      <img
        src="tagStandard41h12-id0.png"
        alt="AprilTag tagStandard41h12 ID 0">
    </div>
    <p>tagStandard41h12 / ID 0</p>
  </main>
</body>
</html>
