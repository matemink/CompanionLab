<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnboardAutonomy Camera</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Lucida Console", "Cascadia Mono", monospace;
      --ink: #eef3ee;
      --muted: #85918e;
      --panel: #101817;
      --line: #263532;
      --live: #53e6a8;
      --target: #49d9ff;
      --warn: #ffbd5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 0%, #203b35 0, transparent 36%),
        linear-gradient(145deg, #070b0b, #0c1211 58%, #101a18);
      color: var(--ink);
    }

    main {
      width: min(
        1080px,
        100%,
        calc((100vh - 170px) * 4 / 3)
      );
      display: grid;
      gap: 14px;
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      background: rgb(10 16 15 / 82%);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 transparent;
    }

    .badge.live {
      color: var(--live);
      border-color: color-mix(in srgb, var(--live) 45%, transparent);
    }

    .badge.live .dot {
      background: var(--live);
      box-shadow: 0 0 14px var(--live);
    }

    .viewer {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(rgb(255 255 255 / 2%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 2%) 1px, transparent 1px),
        #050808;
      background-size: 24px 24px;
      box-shadow: 0 24px 70px rgb(0 0 0 / 42%);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      image-rendering: auto;
    }

    .waiting {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-align: center;
      pointer-events: none;
    }

    .waiting.hidden {
      display: none;
    }

    .scanline {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent 3px,
        rgb(0 0 0 / 8%) 4px
      );
    }

    footer {
      align-items: flex-start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    #target {
      color: var(--target);
      text-align: right;
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      main {
        width: min(
          100%,
          calc((100vh - 215px) * 4 / 3)
        );
      }

      header,
      footer {
        align-items: flex-start;
        flex-direction: column;
      }

      #target {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Raspberry Pi 5 / Camera Module 3</p>
        <h1>OnboardAutonomy Vision</h1>
      </div>
      <div class="badge" id="status">
        <span class="dot"></span>
        <span id="status-text">WAITING FOR CAMERA</span>
      </div>
    </header>

    <section class="viewer">
      <canvas id="camera" width="640" height="480"></canvas>
      <div class="waiting" id="waiting">
        START ONBOARD AUTONOMY WITH CAMERA PREVIEW
      </div>
      <div class="scanline"></div>
    </section>

    <footer>
      <div id="frame">NO FRAME</div>
      <div id="target">APRILTAG NOT VISIBLE</div>
    </footer>
  </main>

  <script>
    const canvas = document.querySelector("#camera");
    const context = canvas.getContext("2d");
    const status = document.querySelector("#status");
    const statusText = document.querySelector("#status-text");
    const waiting = document.querySelector("#waiting");
    const frameText = document.querySelector("#frame");
    const targetText = document.querySelector("#target");

    let imageData = null;
    let nextPollDelay = 100;

    function setOffline(message) {
      status.classList.remove("live");
      statusText.textContent = message;
      waiting.classList.remove("hidden");
      nextPollDelay = 600;
    }

    function drawTargets(targets) {
      context.lineWidth = Math.max(2, canvas.width / 240);
      context.font = `${Math.max(14, canvas.width / 36)}px Lucida Console`;

      for (const target of targets) {
        const corners = target.corners;
        if (corners.length !== 4) {
          continue;
        }

        context.strokeStyle = "#49d9ff";
        context.fillStyle = "#49d9ff";
        context.beginPath();
        context.moveTo(corners[0][0], corners[0][1]);
        for (let index = 1; index < corners.length; index += 1) {
          context.lineTo(corners[index][0], corners[index][1]);
        }
        context.closePath();
        context.stroke();

        const [centerX, centerY] = target.center;
        context.beginPath();
        context.arc(centerX, centerY, 5, 0, Math.PI * 2);
        context.fill();

        const label = `TAG ${target.id}`;
        const labelWidth = context.measureText(label).width + 14;
        const labelY = Math.max(22, corners[0][1] - 10);
        context.fillStyle = "rgb(5 12 12 / 82%)";
        context.fillRect(
          corners[0][0],
          labelY - 20,
          labelWidth,
          25
        );
        context.fillStyle = "#49d9ff";
        context.fillText(label, corners[0][0] + 7, labelY);
      }
    }

    async function update() {
      try {
        const response = await fetch(
          `/api/frame?t=${Date.now()}`,
          { cache: "no-store" }
        );
        if (response.status === 204) {
          setOffline("WAITING FOR FRAME");
          return;
        }
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const width = Number(response.headers.get("X-Frame-Width"));
        const height = Number(response.headers.get("X-Frame-Height"));
        const sequence = response.headers.get("X-Frame-Sequence");
        const targets = JSON.parse(
          response.headers.get("X-OnboardAutonomy-Targets") || "[]"
        );
        const luma = new Uint8Array(await response.arrayBuffer());
        if (luma.length !== width * height) {
          throw new Error("Incomplete camera frame");
        }

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          imageData = null;
        }
        if (imageData === null) {
          imageData = context.createImageData(width, height);
        }

        const rgba = imageData.data;
        for (
          let source = 0, destination = 0;
          source < luma.length;
          source += 1, destination += 4
        ) {
          const value = luma[source];
          rgba[destination] = value;
          rgba[destination + 1] = value;
          rgba[destination + 2] = value;
          rgba[destination + 3] = 255;
        }
        context.putImageData(imageData, 0, 0);
        drawTargets(targets);

        status.classList.add("live");
        statusText.textContent = "LIVE";
        waiting.classList.add("hidden");
        frameText.textContent =
          `${width}x${height} Y PLANE / FRAME ${sequence}`;
        targetText.textContent = targets.length === 0
          ? "APRILTAG NOT VISIBLE"
          : targets
              .map((target) =>
                `TAG ${target.id} / MARGIN ` +
                target.decision_margin.toFixed(1)
              )
              .join("   ");
        nextPollDelay = 100;
      } catch (error) {
        setOffline("PREVIEW OFFLINE");
        frameText.textContent = error.message.toUpperCase();
        targetText.textContent = "APRILTAG NOT VISIBLE";
      } finally {
        window.setTimeout(update, nextPollDelay);
      }
    }

    update();
  </script>
</body>
</html>
